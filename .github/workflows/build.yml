name: Build Android APK

on:
  push:
    branches: [ "main", "master", "arena/01a03dca-tamirkar" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 36.1 + build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew test --stacktrace --no-daemon
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Verify APK output
        run: find app/build/outputs -type f -name "*.apk" -ls
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamirkar-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
