name: Auto-Detect and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Force Build APK (Ignore AI Errors)
      env:
        _JAVA_OPTIONS: "-Djava.awt.headless=true"
      run: ./gradlew assembleDebug -x lint -x test --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: My-Android-App
        path: app/build/outputs/apk/**/*.apk
